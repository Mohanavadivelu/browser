name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron fetches its binary on first use; doing it once here keeps test files that run
      # in parallel from racing to install it.
      - name: Install Electron
        run: node -e "console.log(require('electron'))"

      - name: Unit tests
        run: npm test

      # Launches the real app against a local server: sandboxing, navigation, downloads,
      # full screen, find, zoom, history, restore, and real recordings with sound.
      - name: End-to-end smoke tests
        run: npm run smoke

      - name: Audit production dependencies
        run: npm run audit:prod

      # The packaged app starts from app.asar with its fuses and packed dependencies, which the
      # tests above (run from source) cannot show.
      - name: Build the app folder
        run: npx electron-builder --win dir --x64 --publish never

      - name: Packaged app check
        run: npm run test:packaged
