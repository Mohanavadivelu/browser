name: Release

# Pushing a tag such as v0.4.0 tests the code, builds the Windows installer and portable .exe,
# and publishes them as a GitHub release with notes from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Electron
        run: node -e "console.log(require('electron'))"

      - name: Unit tests
        run: npm test

      - name: End-to-end smoke tests
        run: npm run smoke

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Packaged app check
        run: npm run test:packaged

      - name: Write release notes and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section for this version, without its heading.
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo
            echo "The builds are not code-signed, so Windows SmartScreen may warn about an unknown publisher: choose More info, then Run anyway."
          } >> release-notes.md
          cd dist
          sha256sum Simple-Browser-Setup-*.exe Simple-Browser-*-portable.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Simple-Browser-Setup-*.exe dist/Simple-Browser-Setup-*.exe.blockmap dist/latest.yml \
            dist/Simple-Browser-*-portable.exe dist/SHA256SUMS.txt \
            --title "Simple Browser ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
