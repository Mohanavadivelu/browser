<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Simple Browser</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="chrome">
    <div class="tabbar">
      <div class="tabs" id="tabs"></div>
      <button class="icon-btn new-tab" id="newTab" title="New tab (Ctrl+T)">＋</button>
      <button class="icon-btn tab-search-btn" id="tabSearchButton" type="button" title="Search tabs (Ctrl+Shift+A)" aria-label="Search tabs (Ctrl+Shift+A)" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div class="toolbar">
      <button class="icon-btn" id="back" title="Back (Alt+Left)">←</button>
      <button class="icon-btn" id="forward" title="Forward (Alt+Right)">→</button>
      <button class="icon-btn" id="reload" title="Reload (Ctrl+R)">⟳</button>
      <button class="icon-btn" id="home" title="Home">⌂</button>

      <form class="address" id="addressForm" autocomplete="off">
        <button class="security" id="security" type="button" aria-haspopup="dialog" aria-expanded="false" hidden></button>
        <input id="address" type="text" spellcheck="false" aria-label="Address bar" placeholder="Search or enter a web address" role="combobox" aria-controls="suggestions" aria-expanded="false" aria-autocomplete="both">
        <span class="complete-hint" id="completeHint" hidden>Tab to accept</span>
        <button class="split-chip" id="splitSide" type="button" hidden></button>
        <button class="zoom-chip" id="zoom" type="button" title="Reset zoom"></button>
        <button class="videos-chip" id="videos" type="button" aria-haspopup="dialog" hidden></button>
        <button class="reader-btn" id="reader" type="button" title="Reading mode" aria-label="Reading mode" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"></path><path d="M12 6v13"></path></svg>
        </button>
        <button class="shield" id="shield" type="button" hidden></button>
        <button class="star" id="star" type="button" title="Bookmark (Ctrl+D)">☆</button>
        <div class="notice" id="notice" role="status"></div>
        <div class="suggestions" id="suggestions" role="listbox" aria-label="Suggestions" hidden></div>
      </form>

      <button class="icon-btn downloads-btn" id="downloads" type="button" aria-haspopup="dialog" hidden></button>
      <div class="rec-badge" id="recBadge">
        <span class="dot"></span><span id="recTime">REC 00:00</span>
        <button id="recMark" type="button" title="Add a marker here (Ctrl+Shift+M)">Mark</button>
        <button id="recPause" type="button">Pause</button>
        <button id="recStop" type="button">Stop</button>
      </div>
      <button class="icon-btn" id="shot" title="Screenshot (Ctrl+Shift+S)">📷</button>
      <button class="icon-btn rec-btn" id="record" title="Record this page (Ctrl+Shift+E)">●</button>
      <button class="icon-btn" id="fullscreen" title="Full screen (F11; F11 or hold Esc to leave)">⛶</button>
      <button class="icon-btn" id="menu" title="Menu">⋮</button>
    </div>

    <div class="bookmarks" id="bookmarks"></div>
    <div class="loading" id="loading"></div>
  </div>
  <section id="starPopover" class="star-popover" role="dialog" aria-labelledby="starTitle" hidden>
    <h2 id="starTitle">Bookmark added</h2>
    <label class="field">Name
      <input id="starName" type="text" maxlength="200" spellcheck="false">
    </label>
    <label class="field">Folder
      <select id="starFolder"></select>
    </label>
    <label class="field" id="starNewFolderField" hidden>New folder name (in the Bookmarks bar)
      <input id="starNewFolder" type="text" maxlength="200" spellcheck="false" value="New folder">
    </label>
    <div class="star-actions">
      <button id="starRemove" type="button" class="danger">Remove</button>
      <button id="starDone" type="button" class="primary">Done</button>
    </div>
  </section>
  <section id="shieldPanel" class="shield-panel" role="dialog" aria-labelledby="shieldTitle" hidden>
    <div class="shield-head">
      <svg class="shield-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path class="tick" d="M9 12l2 2 4-4"></path></svg>
      <div>
        <h2 id="shieldTitle"></h2>
        <p id="shieldNote"></p>
      </div>
    </div>
    <label class="shield-switch"><span>Block on this site</span><input id="shieldSwitch" type="checkbox" role="switch"></label>
    <div class="shield-cols" id="shieldCols"><span>Blocked from</span><span>Requests</span></div>
    <ul class="shield-hosts" id="shieldHosts"></ul>
    <div class="shield-foot">
      <span id="shieldLists"></span>
      <button id="shieldAllowed" type="button">Allowed sites</button>
    </div>
  </section>
  <section id="downloadsPanel" class="downloads-panel" role="dialog" aria-labelledby="downloadsTitle" hidden>
    <div class="panel-head">
      <h2 id="downloadsTitle">Downloads</h2>
      <span id="downloadsSummary"></span>
    </div>
    <ul id="downloadsItems" class="dl-items"></ul>
    <div class="panel-foot">
      <button id="downloadsAll" type="button" class="link">Show all downloads</button>
      <span>Ctrl+J</span>
    </div>
  </section>
  <section id="sitePanel" class="site-panel" role="dialog" aria-labelledby="siteTitle" hidden></section>
  <section id="groupPanel" class="group-panel" role="dialog" aria-label="Tab group" hidden>
    <label class="group-field">Name
      <input id="groupName" type="text" maxlength="60" spellcheck="false" placeholder="Name this group">
    </label>
    <div id="groupColors" class="group-colors" role="radiogroup" aria-label="Colour"></div>
    <div class="group-actions"><button id="groupDone" type="button" class="primary">Done</button></div>
  </section>
  <section id="tabSearchPanel" class="tab-search" role="dialog" aria-label="Search open tabs" hidden>
    <label class="ts-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"></path><path d="M20 20l-4-4"></path></svg>
      <input id="tabSearchInput" type="text" spellcheck="false" autocomplete="off" placeholder="Search open tabs" aria-label="Search open tabs"
        role="combobox" aria-controls="tabSearchList" aria-expanded="true" aria-autocomplete="list">
      <span id="tabSearchCount" class="ts-count"></span>
    </label>
    <ul id="tabSearchList" class="ts-list" role="listbox" aria-label="Open tabs"></ul>
    <div class="ts-keys"><span><kbd>↑</kbd> <kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> go to the tab</span><span><kbd>Ctrl</kbd>+<kbd>Del</kbd> close it</span><span><kbd>Esc</kbd> close</span></div>
  </section>
  <section id="videosPanel" class="videos-panel" role="dialog" aria-labelledby="videosTitle" hidden>
    <div class="panel-head column">
      <h2 id="videosTitle">Videos on this page</h2>
      <p id="videosNote"></p>
    </div>
    <ul id="videosItems" class="video-items"></ul>
  </section>
  <!-- The toolbar's scripts share one scope: helpers first, app.js (the wiring) last. -->
  <div class="split-drop" id="splitDrop" hidden>
    <div class="split-drop-half" data-side="left"><span></span></div>
    <div class="split-drop-half" data-side="right"><span></span></div>
  </div>
  <script src="menu.js"></script>
  <script src="toolbar-base.js"></script>
  <script src="toolbar-tabs.js"></script>
  <script src="toolbar-groups.js"></script>
  <script src="toolbar-bookmarks.js"></script>
  <script src="toolbar-recording.js"></script>
  <script src="toolbar-star.js"></script>
  <script src="toolbar-shield.js"></script>
  <script src="toolbar-downloads.js"></script>
  <script src="toolbar-site.js"></script>
  <script src="toolbar-tabsearch.js"></script>
  <script src="toolbar-suggestions.js"></script>
  <script src="app.js"></script>
</body>
</html>
