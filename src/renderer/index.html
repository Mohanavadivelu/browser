<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Simple Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chrome">
    <div class="tabbar">
      <div class="tabs" id="tabs"></div>
      <button class="icon-btn new-tab" id="newTab" title="New tab (Ctrl+T)">＋</button>
    </div>

    <div class="toolbar">
      <button class="icon-btn" id="back" title="Back (Alt+Left)">←</button>
      <button class="icon-btn" id="forward" title="Forward (Alt+Right)">→</button>
      <button class="icon-btn" id="reload" title="Reload (Ctrl+R)">⟳</button>
      <button class="icon-btn" id="home" title="Home">⌂</button>

      <form class="address" id="addressForm" autocomplete="off">
        <span class="security" id="security"></span>
        <input id="address" type="text" spellcheck="false" aria-label="Address bar" placeholder="Search or enter a web address" role="combobox" aria-controls="suggestions" aria-expanded="false" aria-autocomplete="list">
        <button class="zoom-chip" id="zoom" type="button" title="Reset zoom"></button>
        <button class="shield" id="shield" type="button" hidden></button>
        <button class="star" id="star" type="button" title="Bookmark (Ctrl+D)">☆</button>
        <div class="notice" id="notice" role="status"></div>
        <div class="suggestions" id="suggestions" role="listbox" aria-label="Suggestions" hidden></div>
      </form>

      <div class="rec-badge" id="recBadge">
        <span class="dot"></span><span id="recTime">REC 00:00</span>
        <button id="recMark" type="button" title="Add a marker here (Ctrl+Shift+M)">Mark</button>
        <button id="recPause" type="button">Pause</button>
        <button id="recStop" type="button">Stop</button>
      </div>
      <button class="icon-btn" id="shot" title="Screenshot (Ctrl+Shift+S)">📷</button>
      <button class="icon-btn rec-btn" id="record" title="Record this page (Ctrl+Shift+E)">●</button>
      <button class="icon-btn" id="fullscreen" title="Full screen (F11; F11 or hold Esc to leave)">⛶</button>
      <button class="icon-btn" id="menu" title="Menu">⋮</button>
    </div>

    <div class="bookmarks" id="bookmarks"></div>
    <div class="loading" id="loading"></div>
  </div>
  <section id="starPopover" class="star-popover" role="dialog" aria-labelledby="starTitle" hidden>
    <h2 id="starTitle">Bookmark added</h2>
    <label class="field">Name
      <input id="starName" type="text" maxlength="200" spellcheck="false">
    </label>
    <label class="field">Folder
      <select id="starFolder"></select>
    </label>
    <label class="field" id="starNewFolderField" hidden>New folder name (in the Bookmarks bar)
      <input id="starNewFolder" type="text" maxlength="200" spellcheck="false" value="New folder">
    </label>
    <div class="star-actions">
      <button id="starRemove" type="button" class="danger">Remove</button>
      <button id="starDone" type="button" class="primary">Done</button>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
