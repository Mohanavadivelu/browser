<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action https://www.google.com https://duckduckgo.com https://www.bing.com">
  <title>New tab</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body class="newtab">
  <main>
    <h1>Simple Browser</h1>
    <form id="search" action="https://www.google.com/search" method="get" class="search">
      <input name="q" type="search" placeholder="Search or enter a web address" aria-label="Search" autofocus autocomplete="off">
    </form>
    <section id="topSection" class="tile-section" hidden>
      <h2>Most visited</h2>
      <nav id="topTiles" class="tiles" aria-label="Most visited"></nav>
    </section>
    <section id="bookmarkSection" class="tile-section" hidden>
      <h2>Bookmarks</h2>
      <nav id="bookmarkTiles" class="tiles" aria-label="Bookmarks"></nav>
    </section>
    <p id="emptyHint" class="hint" hidden>The sites you visit most (while history is on in Settings) and your bookmarks bar show here.</p>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
