<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Find in page</title>
  <link rel="stylesheet" href="find.css">
</head>
<body>
  <div class="bar">
    <input id="query" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page" aria-label="Find in page">
    <span id="count" class="count"></span>
    <button id="prev" type="button" title="Previous match (Shift+Enter)">↑</button>
    <button id="next" type="button" title="Next match (Enter)">↓</button>
    <button id="close" type="button" title="Close (Esc)">✕</button>
  </div>
  <script src="find.js"></script>
</body>
</html>
